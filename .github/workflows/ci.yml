name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Data validation (schemas + referential integrity + artifacts)
        run: npm run validate:data
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
# e2e (Playwright, WebGL) runs locally via `npm run e2e` — CI job is a
# follow-up (headless WebGL setup); see docs/NOESIS_ROADMAP.md.
